name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build JAR
        run: mvn -B clean package

      - name: Create EXE with jpackage
        run: |
          jpackage `
            --type exe `
            --input target `
            --main-jar hitask.jar `
            --main-class com.hitask.MainWindow `
            --name Hitask`
            --win-console

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: Hitask.exe
