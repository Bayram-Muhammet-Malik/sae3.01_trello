name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build JAR
        run: mvn -B clean package

      - name: Create EXE with jpackage
        shell: pwsh
        run: |
          $jar = Get-ChildItem target/*.jar | Select-Object -First 1
          echo "Using JAR: $($jar.Name)"

          jpackage --type exe --input target --main-jar $jar.Name --main-class com.hitask.Main --name Hitask --win-console

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: Hitask.exe
